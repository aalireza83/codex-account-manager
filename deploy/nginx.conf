# Example HTTPS proxy. Replace manager.example.com and certificate paths before use.
# Avoid recording OAuth session handles or pasted callback query parameters.
log_format codex_manager_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name manager.example.com;
    access_log /var/log/nginx/codex-account-manager-access.log codex_manager_safe;
    return 308 https://manager.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name manager.example.com;

    ssl_certificate /etc/letsencrypt/live/manager.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manager.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "Codex Account Manager";
    auth_basic_user_file /etc/nginx/.codex-account-manager.htpasswd;
    access_log /var/log/nginx/codex-account-manager-access.log codex_manager_safe;
    error_log /var/log/nginx/codex-account-manager-error.log warn;
    client_max_body_size 11M;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location ^~ /api/login/ {
        error_log /dev/null crit;
        include /etc/nginx/snippets/codex-account-manager-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/codex-account-manager-proxy.conf;
    }
}
